[project]
name = "open-parcel"
version = "0.1.0"

readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "bs4>=0.0.2",
    "detect-secrets>=1.5.0",
    "geopandas>=1.1.4",
    "ipykernel>=6.29.5",
    "jupyterlab>=4.4.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.7",
    "pgvector>=0.5.0",
    "playwright>=1.62.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "nbstripout>=0.8.1",
    "pytest>=8.4.1",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["open_parcel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.13"
# Lets ty resolve the old `open_parcel` imports kept in legacy/.
extra-paths = ["legacy/src"]

[tool.ty.rules]
# example: bump specific rules to error/warn if you want stricter defaults
# possibly-unbound-attribute = "error"

# Notebook-first for now: nothing to build or install as a package.
# The old src/ package lives in legacy/ for reference.
[tool.uv]
package = false
